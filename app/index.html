<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Onederz · 今日待办</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="widget" id="widget" data-tint="light">

  <!-- ── 动态高光：跟着鼠标走，玻璃"被光照到"的生命感 ────────── -->
  <div class="spec" aria-hidden="true"></div>

  <!-- ── 顶部：拖拽手柄 + 状态 + 操作 ───────────────────────── -->
  <header class="bar" id="bar">
    <div class="brand">
      <span class="ring" id="ring" aria-hidden="true">
        <svg viewBox="0 0 36 36"><circle class="ring-bg" cx="18" cy="18" r="15.5"/><circle class="ring-fg" id="ringFg" cx="18" cy="18" r="15.5"/></svg>
        <span class="ring-txt" id="ringTxt">0%</span>
      </span>
      <div class="titles">
        <h1 id="titleText">今日待办</h1>
        <p id="subText">
          <span id="dateText">—</span>
          <span class="sep">·</span>
          <span id="pendingText">暂无待办</span>
          <span class="sep">·</span>
          <span class="sync" id="syncState"><i class="dot" id="syncDot"></i><span id="syncText">本地</span></span>
        </p>
      </div>
    </div>
    <div class="acts">
      <button class="ic" id="btnCollapse" title="收起 / 展开"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <button class="ic" id="btnMenu" title="更多"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
      <button class="ic" id="btnHide" title="隐藏到托盘 / 关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </header>

  <!-- ── 完成进度 ──────────────────────────────────────────── -->
  <div class="progress"><i id="progressBar"></i></div>

  <!-- ── 列表 ──────────────────────────────────────────────── -->
  <main class="list" id="list" tabindex="0"></main>

  <!-- ── 底部：添加 ─────────────────────────────────────────── -->
  <footer class="composer" id="composer">
    <div class="seg" id="typeSeg" role="tablist">
      <button class="seg-btn on" data-type="daily" role="tab" title="添加一次，每天自动出现">常驻</button>
      <button class="seg-btn" data-type="temp" role="tab" title="仅今天有效，明天自动清除">临时</button>
    </div>
    <div class="input-wrap">
      <input id="input" type="text" placeholder="添加一条待办…" autocomplete="off" enterkeyhint="done">
      <button class="mini" id="btnDur" title="设置时长（如：读书 一小时）"><svg viewBox="0 0 24 24"><path d="M7 4h10M7 20h10M8 4v3.5L12 11l4-3.5V4M8 20v-3.5L12 13l4 3.5V20"/></svg></button>
      <button class="mini" id="btnAt" title="设置提醒时间"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></button>
      <button class="mini" id="btnCd" title="设置倒计时"><svg viewBox="0 0 24 24"><path d="M12 3l7 4v10l-7 4-7-4V7z"/><path d="M12 8v4l2.5 1.5"/></svg></button>
    </div>
    <button class="add" id="btnAdd" title="添加（Enter）"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </footer>

  <!-- ── 浮层：单条待办的操作菜单 ───────────────────────────── -->
  <div class="pop" id="itemPop" hidden>
    <button data-act="edit"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z"/></svg>编辑内容</button>
    <button data-act="remind"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span id="popRemindLabel">设定提醒</span></button>
    <button data-act="countdown"><svg viewBox="0 0 24 24"><path d="M12 3l7 4v10l-7 4-7-4V7z"/><path d="M12 8v4l2.5 1.5"/></svg><span id="popCdLabel">设定倒计时</span></button>
    <button data-act="clearTime"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>清除时间</button>
    <div class="pop-sep"></div>
    <button data-act="delete" class="danger"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M8 7l1 12h6l1-12"/></svg>删除</button>
  </div>

  <!-- ── 浮层：主菜单 ──────────────────────────────────────── -->
  <div class="pop" id="mainPop" hidden>
    <button data-act="addFocus"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/></svg>添加常驻任务</button>
    <button data-act="hideDone"><svg viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.5"/></svg><span id="popHideDone">隐藏已完成</span></button>
    <button data-act="tint"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/></svg><span id="popTint">切换深色玻璃</span></button>
    <div class="pop-sep"></div>
    <button data-act="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg>设置与同步</button>
    <button data-act="export"><svg viewBox="0 0 24 24"><path d="M12 3v11M8 10l4 4 4-4M5 19h14"/></svg>导出备份</button>
    <button data-act="import"><svg viewBox="0 0 24 24"><path d="M12 14V3M8 7l4-4 4 4M5 19h14"/></svg>导入备份</button>
    <div class="pop-sep"></div>
    <button data-act="quit" class="danger"><svg viewBox="0 0 24 24"><path d="M15 5H6v14h9M13 12h8M18 9l3 3-3 3"/></svg>退出 Onederz</button>
  </div>

  <!-- ── 浮层：时间选择 ────────────────────────────────────── -->
  <div class="pop" id="timePop" hidden>
    <div class="pop-head" id="timePopHead">设定提醒时间</div>
    <div class="pop-quick" id="timeQuick"></div>
    <div class="pop-row" id="timeRow">
      <input type="time" id="timeInput" step="60">
      <button class="primary" id="timeOk">确定</button>
    </div>
    <div class="pop-row" id="durRow" hidden>
      <input type="number" id="durInput" min="1" max="720" step="5" value="30">
      <span class="dur-unit">分钟</span>
      <button class="primary" id="durOk">确定</button>
    </div>
    <div class="pop-tip" id="timeTip"></div>
  </div>

  <!-- ── 设置面板 ──────────────────────────────────────────── -->
  <section class="panel" id="panel" hidden>
    <header class="panel-bar">
      <button class="ic" id="panelBack" title="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 id="panelTitle">设置与同步</h2>
      <span class="spacer"></span>
    </header>
    <div class="panel-body" id="panelBody"></div>
  </section>

  <!-- ── 通知气泡（应用内提醒） ─────────────────────────────── -->
  <div class="toast-wrap" id="toastWrap"></div>

  <!-- ── 缩放热区（仅桌面端显示） ───────────────────────────── -->
  <div class="rz rz-n" data-dir="n"></div><div class="rz rz-s" data-dir="s"></div>
  <div class="rz rz-w" data-dir="w"></div><div class="rz rz-e" data-dir="e"></div>
  <div class="rz rz-nw" data-dir="nw"></div><div class="rz rz-ne" data-dir="ne"></div>
  <div class="rz rz-sw" data-dir="sw"></div><div class="rz rz-se" data-dir="se"></div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
