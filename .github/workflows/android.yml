name: Android APK

on:
  workflow_dispatch: {} # 手动触发
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'mobile/**'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  apk:
    runs-on: ubuntu-latest # GitHub 云端自带 Android SDK，无需本地装任何东西
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 组装 Android 工程（前端同步 + Capacitor + 悬浮窗集成）
        run: |
          node scripts/sync-mobile.js
          cd mobile
          npm install --no-audit --no-fund
          [ -d android ] || npx --yes cap add android
          node ../scripts/apply-android-overlay.js
          npx cap sync android

      - name: 编译 debug APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: trans-todo-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
